<script>
(function(){
  var w=document.querySelector('.wa-float'); if(!w||!('IntersectionObserver' in window)) return;
  var t=[document.getElementById('contato'),document.querySelector('footer')].filter(Boolean), vis=new Set();
  var io=new IntersectionObserver(function(es){ es.forEach(function(e){ e.isIntersecting?vis.add(e.target):vis.delete(e.target); }); w.classList.toggle('wa-hide',vis.size>0); },{threshold:0.05});
  t.forEach(function(el){ io.observe(el); });
})();
(function(){
  var b=document.querySelector('.menu-btn'), n=document.getElementById('nav-principal'); if(!b||!n) return;
  function set(o){ n.classList.toggle('open',o); b.setAttribute('aria-expanded',o?'true':'false'); b.textContent=o?'Fechar':'Menu'; }
  b.addEventListener('click',function(){ set(!n.classList.contains('open')); });
  n.addEventListener('click',function(e){ if(e.target.tagName==='A') set(false); });
})();
</script>
